[project]
name = "tg-recall"
version = "0.9.0"
description = "Local-first, profile-aware Telegram archive with CLI and MCP access for AI agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "Rerowros" },
]
keywords = ["ai-agents", "archive", "mcp", "sqlite", "telegram", "telethon", "transcription"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "platformdirs>=4.3.0",
  "telethon>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/Rerowros/tg-recall"
Repository = "https://github.com/Rerowros/tg-recall"
Issues = "https://github.com/Rerowros/tg-recall/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
tg-recall = "tg_recall.cli:main"
tg-recall-mcp = "tg_recall.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_recall"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/tg_recall",
  "/tests",
  "/docs",
  "/README.md",
  "/README.ru.md",
  "/LICENSE",
  "/SECURITY.md",
  "/SECURITY.ru.md",
  "/CONTRIBUTING.md",
  "/CONTRIBUTING.ru.md",
  "/CHANGELOG.md",
  "/CHANGELOG.ru.md",
  "/ROADMAP.md",
  "/ROADMAP.ru.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/.codex",
  "/.tg-ecosystem",
  "/.tg-recall",
  "/exports",
  "/reports",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
